[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-ci-testing-case-study"
version = "0.1.0"
description = "A small Python interview repo focused on testing and CI."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Mike Cichonski", email = "mike.cichonski@gmail.com" },
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

